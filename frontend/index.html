<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Bootstrap and custom styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body-tertiary">

    <!-- Alerts and loading spinner -->
    <div id="alertContainer" class="position-fixed top-0 start-50 translate-middle-x mt-3"
        style="z-index: 1080; width: 90%; max-width: 500px;"></div>

    <div id="loadingSpinner" class="position-fixed top-50 start-50 translate-middle d-none" style="z-index: 1090;">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Navigation bar -->
    <nav class="navbar custom-navbar border-bottom shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold mb-0 h1 text-body">Expense Tracker</span>

            <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2">
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
                <span id="themeText">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Summary cards -->
    <div class="container mb-4">
        <div class="summary-grid">

            <div class="summary-card bg-body p-3 shadow-sm rounded-3 border-start border-primary border-4">
                <div>
                    <span class="small fw-semibold text-uppercase text-muted d-block mb-1">Total Spent</span>
                    <h3 class="fw-bold mb-0 text-body" id="totalAmount">0.00</h3>
                </div>

                <div
                    class="card-icon rounded-circle d-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary">
                    <i class="bi bi-wallet2 fs-4"></i>
                </div>
            </div>

            <div class="summary-card bg-body p-3 shadow-sm rounded-3 border-start border-info border-4">
                <div>
                    <span class="small fw-semibold text-uppercase text-muted d-block mb-1">Number of Expenses</span>
                    <h3 class="fw-bold mb-0 text-body" id="totalCount">0</h3>
                </div>

                <div
                    class="card-icon rounded-circle d-flex align-items-center justify-content-center bg-info bg-opacity-10 text-info">
                    <i class="bi bi-receipt fs-4"></i>
                </div>
            </div>

            <div class="summary-card bg-body p-3 shadow-sm rounded-3 border-start border-warning border-4">
                <div>
                    <span class="small fw-semibold text-uppercase text-muted d-block mb-1">Highest Expense</span>
                    <h3 class="fw-bold mb-0 text-body" id="highestExpense">0.00</h3>
                </div>

                <div
                    class="card-icon rounded-circle d-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning">
                    <i class="bi bi-graph-up-arrow fs-4"></i>
                </div>
            </div>

        </div>
    </div>

    <!-- Add expense form and category chart -->
    <div class="container mb-4">
        <div class="row g-4">

            <div class="col-12 col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="mb-3 fw-bold">Add expense</h6>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" placeholder="Lunch">
                            </div>

                            <div class="col-12 col-sm-6 col-md-6">
                                <label for="amount" class="form-label">Amount</label>
                                <input type="number" class="form-control" id="amount" placeholder="4.50" step="0.01">
                            </div>

                            <div class="col-12 col-sm-6 col-md-6">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category">
                                    <option selected disabled>Choose...</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date">
                            </div>
                        </div>

                        <button type="button" class="btn bg-primary bg-opacity-10 px-4 mt-3" id="addExpenseBtn">
                            Add expense
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <h6 class="mb-3 fw-bold w-100 text-start">Expenses by Category</h6>

                        <div style="width: 100%; max-width: 280px; height: 240px; position: relative;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Expenses table, filters, and export -->
    <div class="container mb-5">
        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                    <h5 class="mb-0">Expenses</h5>

                    <div class="d-flex flex-wrap align-items-center gap-2">

                        <div class="input-group input-group-sm" style="max-width: 200px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search title...">
                        </div>

                        <div class="d-flex align-items-center gap-1">
                            <label for="monthFilter" class="mb-0 small text-nowrap">Month</label>
                            <input type="month" id="monthFilter" class="form-control form-control-sm">
                        </div>

                        <button id="resetFiltersBtn" class="btn btn-sm btn-outline-secondary">Reset</button>

                        <div class="d-flex align-items-center gap-1">
                            <label for="categoryFilter" class="mb-0 small text-nowrap">Category</label>
                            <select id="categoryFilter" class="form-select form-select-sm">
                                <option value="All">All</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th class="text-nowrap">
                                    Title
                                </th>

                                <th class="sortable text-nowrap" style="cursor: pointer;"
                                    onclick="handleSort('amount')">
                                    Amount
                                    <i id="sortIcon-amount"
                                        class="bi bi-arrow-down-up text-muted small ms-1"></i>
                                </th>

                                <th class="text-nowrap">
                                    Category
                                </th>

                                <th class="sortable text-nowrap" style="cursor: pointer;" onclick="handleSort('date')">
                                    Date
                                    <i id="sortIcon-date"
                                        class="bi bi-arrow-down-up text-muted small ms-1"></i>
                                </th>

                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>

                        <tbody id="expensesTableBody"></tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end mt-3">
                    <button id="exportCsvBtn" class="btn btn-sm btn-success d-flex align-items-center gap-1">
                        <i class="bi bi-file-earmark-spreadsheet"></i> Export CSV
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Edit expense modal -->
    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editExpenseForm">

                        <input type="hidden" id="editId">

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle">
                        </div>

                        <div class="mb-3">
                            <label for="editAmount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="editAmount" step="0.01">
                        </div>

                        <div class="mb-3">
                            <label for="editCategory" class="form-label">Category</label>
                            <select class="form-select" id="editCategory">
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="editDate">
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" id="saveEditBtn">Save Changes</button>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript libraries and application code -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
